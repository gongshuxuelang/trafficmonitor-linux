name: Daily release

on:
  schedule:
    # 05:00 Asia/Shanghai（UTC+8）。GitHub cron 使用 UTC，所以是前一天 21:00。
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '没有新提交时也强制打包发布'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      last_tag: ${{ steps.check.outputs.last_tag }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: check
        run: |
          git fetch --tags --force
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "last_tag=none" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            COMMITS=$(git rev-list --count "${LAST_TAG}..HEAD")
            echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
            if [ "$COMMITS" -gt 0 ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Nothing to release
        if: steps.check.outputs.should_release != 'true' && !inputs.force
        env:
          LAST_TAG: ${{ steps.check.outputs.last_tag }}
        run: echo "No new commits since $LAST_TAG, skipping."

      - name: Compute version
        id: version
        if: steps.check.outputs.should_release == 'true' || inputs.force
        env:
          LAST_TAG: ${{ steps.check.outputs.last_tag }}
        run: |
          FILE_VERSION=$(sed -n 's/^project(trafficmonitor_linux VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          TAG_VERSION=""
          if [ "$LAST_TAG" != "none" ]; then
            TAG_VERSION=$(printf '%s\n' "$LAST_TAG" | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          fi
          VERSION="$FILE_VERSION"
          if [ -n "$TAG_VERSION" ]; then
            VERSION=$(printf '%s\n%s\n' "$FILE_VERSION" "$TAG_VERSION" | sort -V | tail -1)
          fi
          if [ -z "$VERSION" ]; then
            echo "无法确定版本前缀" >&2
            exit 1
          fi
          RELEASE="$(date +%Y%m%d).$(git rev-parse --short=7 HEAD)"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${RELEASE}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            name: ubuntu22
          - image: ubuntu:24.04
            name: ubuntu24
          - image: ubuntu:26.04
            name: ubuntu26
          - image: debian:12
            name: debian12
          - image: debian:13
            name: debian13
    container:
      image: ${{ matrix.image }}
    env:
      TZ: Asia/Shanghai
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl tzdata

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build dpkg-dev file binutils squashfs-tools \
            libgl-dev libopengl-dev libegl-dev libgles-dev \
            qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite libqt6svg6

      - name: Ensure CMake >= 3.28
        run: |
          CUR=$(cmake --version 2>/dev/null | sed -n '1s/^cmake version //p')
          if [ -z "$CUR" ] || [ "$(printf '%s\n%s\n' "$CUR" "3.28.0" | sort -V | head -1)" != "3.28.0" ]; then
            case "$(uname -m)" in
              x86_64) CMAKE_ARCH=x86_64 ;;
              aarch64|arm64) CMAKE_ARCH=aarch64 ;;
              *) echo "不支持的架构: $(uname -m)" >&2; exit 1 ;;
            esac
            echo "当前 CMake ${CUR:-未安装}，安装 3.31.6"
            curl -fsSL -o /tmp/cmake.tar.gz \
              "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-${CMAKE_ARCH}.tar.gz"
            curl -fsSL -o /tmp/cmake-sha256.txt \
              "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-SHA-256.txt"
            EXPECTED=$(grep "cmake-3.31.6-linux-${CMAKE_ARCH}.tar.gz" /tmp/cmake-sha256.txt | awk '{print $1}')
            echo "${EXPECTED}  /tmp/cmake.tar.gz" | sha256sum -c -
            tar -xzf /tmp/cmake.tar.gz -C /opt
            echo "/opt/cmake-3.31.6-linux-${CMAKE_ARCH}/bin" >> "$GITHUB_PATH"
          fi

      - name: Configure and build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Package
        env:
          TM_DEB_RELEASE: ${{ needs.prepare.outputs.release }}
        run: bash packaging/build-deb.sh --skip-build

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.name }}
          path: build/packages/*.deb
          if-no-files-found: error

      - name: Build AppImage
        if: matrix.name == 'ubuntu22'
        env:
          TM_DEB_RELEASE: ${{ needs.prepare.outputs.release }}
        run: bash packaging/build-appimage.sh --skip-build

      - name: Upload AppImage
        if: matrix.name == 'ubuntu22'
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: build/packages/*.AppImage
          if-no-files-found: error

  build_rpm:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: fedora:latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Install git
        run: |
          dnf install -y --setopt=install_weak_deps=False git ca-certificates curl tar gzip

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc-c++ cmake ninja-build rpm-build file binutils \
            mesa-libGL-devel mesa-libEGL-devel mesa-libGLES-devel libglvnd-devel \
            qt6-qtbase-devel qt6-qtsvg-devel

      - name: Configure and build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Package
        env:
          TM_DEB_RELEASE: ${{ needs.prepare.outputs.release }}
        run: bash packaging/build-rpm.sh --skip-build

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: build/packages/*.rpm
          if-no-files-found: error

  build_arch:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Install git
        run: |
          pacman -Syu --noconfirm --needed git ca-certificates curl

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          pacman -S --noconfirm --needed base-devel cmake ninja mesa libglvnd qt6-base qt6-svg

      - name: Configure and build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Package
        env:
          TM_DEB_RELEASE: ${{ needs.prepare.outputs.release }}
        run: bash packaging/build-arch.sh --skip-build

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: arch
          path: build/packages/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [prepare, build, build_rpm, build_arch]
    if: >-
      (needs.prepare.outputs.should_release == 'true' || inputs.force) &&
      needs.build.result == 'success' &&
      needs.build_rpm.result == 'success' &&
      needs.build_arch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) \
            -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS

      - name: Release notes
        env:
          LAST_TAG: ${{ needs.prepare.outputs.last_tag }}
        run: |
          if [ "$LAST_TAG" = "none" ]; then
            COMMITS=$(git log --pretty='- %h %s' -20)
          else
            COMMITS=$(git log --pretty='- %h %s' "${LAST_TAG}..HEAD")
          fi
          {
            echo "### 安装包"
            echo
            echo '- Debian/Ubuntu：`ubuntu22-*`、`ubuntu24-*`、`ubuntu26-*`、`debian12-*`、`debian13-*` 的 `.deb`，分在线包和离线包。'
            echo '- 通用 AppImage：`trafficmonitor-linux_*.AppImage`，捆绑 Qt，建议在 glibc 2.35+ 的系统上使用；没有 libfuse2 时可以加 `--appimage-extract-and-run`。'
            echo '- Fedora RPM：`*.rpm`，文件名带 `fcXX` 发行版标识；RHEL/openSUSE 可以用同一脚本在对应系统构建。'
            echo '- Arch/Manjaro：`*.pkg.tar.zst`。'
            echo
            echo '离线包和 AppImage 已捆绑 Qt 运行库与插件。使用 `SHA256SUMS` 校验下载文件。'
            echo
            echo "### 本次提交"
            echo
            echo "$COMMITS"
          } > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: TrafficMonitor for Linux ${{ needs.prepare.outputs.release }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.rpm
            artifacts/*.pkg.tar.zst
            artifacts/SHA256SUMS
