name: Daily release

on:
  schedule:
    # 05:00 Asia/Shanghai（UTC+8）。GitHub cron 使用 UTC，所以是前一天 21:00。
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '没有新提交时也强制打包发布'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # 与构建要求一致：Qt 6.10、GCC 15、CMake 4
      image: ubuntu:26.04
    env:
      TZ: Asia/Shanghai
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates tzdata

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check for new commits
        id: check
        run: |
          git fetch --tags --force
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "last_tag=none" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            COMMITS=$(git rev-list --count "${LAST_TAG}..HEAD")
            echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
            if [ "$COMMITS" -gt 0 ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Nothing to release
        if: steps.check.outputs.should_release != 'true' && !inputs.force
        env:
          LAST_TAG: ${{ steps.check.outputs.last_tag }}
        run: echo "No new commits since $LAST_TAG, skipping."

      - name: Install build dependencies
        if: steps.check.outputs.should_release == 'true' || inputs.force
        run: |
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build dpkg-dev file binutils \
            qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite libqt6svg6

      - name: Compute version
        id: version
        if: steps.check.outputs.should_release == 'true' || inputs.force
        env:
          LAST_TAG: ${{ steps.check.outputs.last_tag }}
        run: |
          FILE_VERSION=$(sed -n 's/^project(trafficmonitor_linux VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          TAG_VERSION=""
          if [ "$LAST_TAG" != "none" ]; then
            TAG_VERSION=$(printf '%s\n' "$LAST_TAG" | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          fi
          VERSION="$FILE_VERSION"
          if [ -n "$TAG_VERSION" ]; then
            VERSION=$(printf '%s\n%s\n' "$FILE_VERSION" "$TAG_VERSION" | sort -V | tail -1)
          fi
          if [ -z "$VERSION" ]; then
            echo "无法确定版本前缀" >&2
            exit 1
          fi
          RELEASE="$(date +%Y%m%d).$(git rev-parse --short=7 HEAD)"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Configure and build
        if: steps.check.outputs.should_release == 'true' || inputs.force
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Test
        if: steps.check.outputs.should_release == 'true' || inputs.force
        run: ctest --preset release --output-on-failure

      - name: Package
        if: steps.check.outputs.should_release == 'true' || inputs.force
        env:
          TM_DEB_RELEASE: ${{ steps.version.outputs.release }}
        run: bash packaging/build-deb.sh --skip-build

      - name: Checksums
        if: steps.check.outputs.should_release == 'true' || inputs.force
        run: |
          cd build/packages
          sha256sum *.deb > SHA256SUMS

      - name: Release notes
        if: steps.check.outputs.should_release == 'true' || inputs.force
        env:
          LAST_TAG: ${{ steps.check.outputs.last_tag }}
        run: |
          if [ "$LAST_TAG" = "none" ]; then
            COMMITS=$(git log --pretty='- %h %s' -20)
          else
            COMMITS=$(git log --pretty='- %h %s' "${LAST_TAG}..HEAD")
          fi
          {
            echo "### 安装包"
            echo
            echo '- `ubuntu26-trafficmonitor-linux_*.deb`：在线包，Qt 依赖由 apt 从软件源安装。'
            echo '- `ubuntu26-trafficmonitor-linux-offline_*.deb`：离线包，已捆绑 Qt 运行库和插件，只依赖 `libc6`。'
            echo
            echo '包文件名以 `ubuntu26-` 这类系统标识开头，对应构建机的发行版。'
            echo '使用 `SHA256SUMS` 校验下载文件。离线包要求目标机器的 glibc 不低于构建机。'
            echo
            echo "### 本次提交"
            echo
            echo "$COMMITS"
          } > release-notes.md

      - name: Publish release
        if: steps.check.outputs.should_release == 'true' || inputs.force
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TrafficMonitor for Linux ${{ steps.version.outputs.release }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            build/packages/*.deb
            build/packages/SHA256SUMS
